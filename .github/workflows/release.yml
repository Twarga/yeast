name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # cosign keyless signing (OIDC)

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact: yeast-linux-amd64
          - os: linux
            arch: arm64
            artifact: yeast-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binary via build-release.sh
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          # Single source of truth: scripts/build-release.sh (CGO_ENABLED=0).
          scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Verify binary
        run: |
          ./dist/${{ matrix.artifact }} version
          ldd ./dist/${{ matrix.artifact }} 2>&1 | grep -q "not a dynamic executable" \
            && echo "static binary confirmed" \
            || { echo "binary is not static"; exit 1; }

      - name: Package tarball
        run: |
          cd dist
          cp ${{ matrix.artifact }} yeast
          tar -czf yeast_${{ matrix.os }}_${{ matrix.arch }}.tar.gz yeast
          rm yeast
          sha256sum yeast_${{ matrix.os }}_${{ matrix.arch }}.tar.gz > yeast_${{ matrix.os }}_${{ matrix.arch }}.tar.gz.sha256

      - name: Collect artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/yeast_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            dist/yeast_${{ matrix.os }}_${{ matrix.arch }}.tar.gz.sha256
          retention-days: 5

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble dist + SHA256SUMS.txt
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'yeast-*' -o -name 'yeast_*' \) -exec cp {} dist/ \;
          cd dist
          cat *.sha256 | sort -u > SHA256SUMS.txt
          rm -f yeast_*.tar.gz.sha256
          ls -la

      - name: Generate SBOM
        run: |
          go version -m dist/yeast-linux-amd64 > dist/SBOM.txt || true
          go list -m all >> dist/SBOM.txt 2>/dev/null || echo "sbom: build deps only" >> dist/SBOM.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          for f in SHA256SUMS.txt *.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
